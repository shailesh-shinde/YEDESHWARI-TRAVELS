<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="ytGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="ytNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="ytShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="100" cy="100" r="94" fill="url(#ytNavy)" stroke="url(#ytGold)" stroke-width="5" filter="url(#ytShadow)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Top Crown Stars -->
  <polygon points="100,24 103,32 111,32 105,37 107,45 100,40 93,45 95,37 89,32 97,32" fill="url(#ytGold)" />
  <circle cx="82" cy="34" r="2" fill="#FDE047" opacity="0.8" />
  <circle cx="118" cy="34" r="2" fill="#FDE047" opacity="0.8" />

  <!-- Main Monogram "YT" -->
  <!-- "Y" -->
  <path d="M 68 52 L 84 76 L 84 96 L 76 96 L 76 80 L 58 52 L 70 52 Z" fill="url(#ytGold)" filter="url(#ytShadow)"/>
  <path d="M 68 52 L 84 76 L 100 52 L 88 52 L 84 62 L 79 52 Z" fill="#FDE047" />

  <!-- "T" -->
  <path d="M 96 52 L 142 52 L 142 63 L 124 63 L 124 96 L 112 96 L 112 63 L 96 63 Z" fill="url(#ytGold)" filter="url(#ytShadow)"/>

  <!-- Sleek Modern Bus Silhouette -->
  <g transform="translate(42, 106)">
    <!-- Bus Body -->
    <path d="M 12 18 C 12 10 20 6 32 6 L 96 6 C 104 6 110 10 112 18 L 115 32 C 115 35 113 37 110 37 L 8 37 C 6 37 5 35 5 32 Z" fill="url(#ytGold)"/>
    <!-- Windows -->
    <path d="M 15 12 L 32 12 L 32 22 L 15 22 Z" fill="#0F172A"/>
    <path d="M 36 12 L 53 12 L 53 22 L 36 22 Z" fill="#0F172A"/>
    <path d="M 57 12 L 74 12 L 74 22 L 57 22 Z" fill="#0F172A"/>
    <path d="M 78 12 L 95 12 L 95 22 L 78 22 Z" fill="#0F172A"/>
    <path d="M 99 12 L 108 14 L 106 22 L 99 22 Z" fill="#0F172A"/>
    <!-- Wheels -->
    <circle cx="28" cy="37" r="8" fill="#020617" stroke="url(#ytGold)" stroke-width="2.5"/>
    <circle cx="28" cy="37" r="3" fill="#FDE047"/>
    <circle cx="92" cy="37" r="8" fill="#020617" stroke="url(#ytGold)" stroke-width="2.5"/>
    <circle cx="92" cy="37" r="3" fill="#FDE047"/>
    <!-- Headlights & details -->
    <rect x="108" y="27" width="5" height="3" rx="1" fill="#FFFFFF"/>
  </g>

  <!-- Golden Ribbon Banner Text: YEDESHWARI -->
  <text x="100" y="166" font-family="'Poppins', sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3.5">
    YEDESHWARI
  </text>
  <text x="100" y="179" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="url(#ytGold)" text-anchor="middle" letter-spacing="4">
    TRAVELS PUNE
  </text>
</svg>